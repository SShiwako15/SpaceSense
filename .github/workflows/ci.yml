name: Application checks

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPACESENSE_DB_PASSWORD: ci_database_password_only
      SPACESENSE_ADMIN_EMAIL: admin@ci.example
      SPACESENSE_ADMIN_PASSWORD: ci_admin_password_only
      SPACESENSE_DEMO_STUDENT_EMAIL: student@ci.example
      SPACESENSE_DEMO_STUDENT_PASSWORD: ci_student_password_only
      PLAYWRIGHT_BASE_URL: http://localhost:8080
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm run setup
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix backend --audit-level=moderate
      - run: npm audit --prefix frontend --audit-level=moderate
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: docker compose --profile test run --build --rm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify production configuration and recovery
        shell: pwsh
        run: ./scripts/Test-Production.ps1
      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes --remove-orphans
